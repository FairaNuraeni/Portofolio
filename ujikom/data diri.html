<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Sederhana</title>
  <style>
    body { font-family: 'Poppins', sans-serif; margin: 0; background: #f0f2f5; }
    header { background: linear-gradient(135deg, #4b6cb7, #182848); color: white; padding: 60px 20px; text-align: center; }
    nav { background: white; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: sticky; top: 0; }
    nav a { color: #182848; margin: 0 20px; text-decoration: none; font-weight: 600; }
    nav a:hover { color: #4b6cb7; }
    section { padding: 60px 20px; max-width: 1000px; margin: auto; }
    h2 { color: #182848; font-size: 32px; margin-bottom: 20px; }
    .profile-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 5px solid #4b6cb7; }
    .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-top: 20px; }
    ul li { margin: 10px 0; font-size: 18px; }
    footer { text-align: center; background: #182848; color: white; padding: 25px; margin-top: 50px; }
  </style>
</head>
<body>
  <header>
    <h1><!-- NAMA LENGKAP --></h1>
    <p>Programmer • Web Developer</p>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#tentang">Tentang Saya</a>
    
    <a href="#kontak">Kontak</a>
  </nav>

  <section id="home">
    <h2>Home</h2>
    <p>Selamat datang di portfolio saya. Ini adalah website sederhana yang menampilkan informasi tentang profil saya, desain, serta kontak.</p>
  </section>

  <section id="tentang">
    <h2>Tentang Saya</h2>
    <img src="<!-- LINK FOTO ANDA -->" alt="Foto Profil" class="profile-img" />
    <div class="card">
      <p><!-- TULIS PROFIL / BIO SINGKAT ANDA DI SINI --></p>
    </div>
  </section>
  <section id="kontak">
    <h2>Kontak</h2>
    <p>Email: <!-- EMAIL ANDA --></p>
    <p>WhatsApp: <!-- NOMOR WA ANDA --></p>
    <p>Instagram: <!-- LINK IG ANDA --></p>
  </section>

  <footer>
    <p>© 2025 Portfolio Anda</p>
  </footer>
</body>
</html>
