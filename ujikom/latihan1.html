<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Input Data</title>
    <style>
        body { font-family: Arial, sans-serif;margin: 20px; }
        form { margin-bottom:20px; }
        input { margin: 5px; padding: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
        th { background: #f2f2f2; }
        button { padding: 5px 10px; margin: 2px; cursor: pointer; }
        .hapus { background: red;color: white; }
        .edit { background: orange; color: white; }
        .simpan { background: green; color: white; }
        #search {margin-top: 10px; padding: 6px; width:250px; }

    body {
        font-family: Arial, sans-serif;
        padding: 20px;
    }
    h2 {
        text-align: center;
    }
    form {
        width: 350px;
        margin: 0 auto;
    }
    .form-group {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
    }
    .form-group label{
        flex: 1;
        margin-right: 10px;
    }
    .form-group input {
        flex: 2;
        padding: 5px;
    }
    .button-simpan {
        display: block;
        width: 100%;
        padding: 8px; 
        margin-top: 15px;
        background: #4CAF50;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
    }
    .button-simpan:hover {
        background: #45a049;
    }
    </style>
</head>
<body>

    <h2>DATA SISWA SMKS AL ITTIHAD</h2>
    <form id="formSiswa">
        <div class="form-group">
            <label for="nis">NIS:</label>
            <input type="text" id="nama" required>
        </div>
        <div class="form-group">
            <label for="nama">NAMA :</label>
            <input type="text" id="nama" required>
        </div>
        <div class="form-group">
            <label for="Kelas">KELAS :</label>
            <input type="text" id="kelas" required>
        </div>
        <button class="button-simpan" type="submit">simpan</button>
    </form>

    <h3>Data Tersimpan</h3>
    <label> cari: <input type="text" id="search" placeholder="cari NIS / Nama / kelas"></label>

    <table id="tabelSiswa">
        <thead>
            <tr>
                <th>No</th>
                <th>Nis</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            <!--Data siswa akan muncul disini-->
        </tbody>
    </table>

    <script>
        const form = document.getElementById('formSiswa');
        const table = document.getElementById('tabelSiswa').getElementsByTagName('tbody')[0];
        const search = document.getElementById('search');
        let dataSiswa =JSON.parse(localStorage.getItem("dataSiswa")) || [];
        function renderTable(){
            tabel.innerHTML = "";
            dataSiswa.forEach((siswa, index) => {
                const row = tabel.insertRow();
                row.insertCell(0).innerText = index = 1;
                row.insertCell(1).innerText = siswa.nis;
                row.insertCell(2).innerText = siswa.nama;
                row.insertCell(3).innerText = siswa.kelas;

                const aksicel = ro.insertCell(4);

                const editBtn = document.createElement("button");
                editBtn.innerText = "Edit";
                editBtn.className = "edit";
                editBtn.onclick = function() {
                    editData (index, row, editBtn);
                };

                const hapusbtn = document.createElement("button");
                hapusbtn.innerText = "Hapus";
                hapusbtn.innerName = "hapus";
                hapusbtn.onclick = function() {

                    dataSiswa.splice(index,1);
                    saveData();
                    renderTable();
                };

                aksicel.appendChild(editBtn);
                aksicel.appendChild(hapusbtn);
            });
        }

        function saveData(){
            localStorage.setItem("dataSiswa",JSON.stringify(dataSiswa));
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const nis = document.getElementById('nis').value;
            const nama = document.getElementById('nama').value;
            const kelas = document.getElementById('kelas').value;

            dataSiswa.push({nis, nama, kelas });
            saveData();
            renderTable();
            form.reset();
        });

        function editData(index, row, editBtn) {
            if (editBtn.innerText === "Edit"){ 
                for ( let i = 1; i <= 3; i++) {
                    let cell = row.cells[i];
                    let input = document.createElement("input");
                    input.value = cell.innerText;
                    cell.innerText = "";
                    cell.appendChild(input);
                }
                editBtn.innerText = "Simpan";
                editBtn.className = "simpan";
            } else {
                dataSiswa[index].nis = row.cells[1].querySelector("input").value;
                dataSiswa[index].nama = row.cells[2].querySelector("input").value;
                dataSiswa[index].kelas = row.cells[3].querySelector("input").value;
                saveData();
                renderTable();
            }
        }

        search.addEventListener("keyup", function() {
            const filter = search.value.tolowerCase();
            const rows = table.getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                let rowText = rows[i].innerText.tolowerCase();
                rows[i].style.display = rowText.includes(filter) ? "" : "none";
            }
        });

        renderTable();
    </script>
</body>
</html>
